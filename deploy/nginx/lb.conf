# nginx in front of `docker compose ... --scale api=N` (see compose.lb.yml).
# Docker's DNS returns one address per running replica for "api". nginx
# re-resolves it every 2 s (`resolve` below), so a stopped replica leaves the
# group and a new or recreated one joins without restarting nginx.
#
# Retries use nginx's default: `proxy_next_upstream error timeout`. A POST is
# passed to the next replica only if it was never sent to the first one
# (for example, connection refused). See lb-retry.conf for the other setting.
# Log only responses that are not 2xx (including 499: the client gave up),
# with the replica that handled them and how long each step took.
map $status $not_2xx {
    ~^2     0;
    default 1;
}
log_format failures '$time_iso8601 status=$status upstream=$upstream_addr '
                    'upstream_status=$upstream_status connect=$upstream_connect_time '
                    'upstream_time=$upstream_response_time request_time=$request_time';

# Docker's embedded DNS server.
resolver 127.0.0.11 valid=2s ipv6=off;

upstream api {
    zone api 64k;              # shared by all workers: the resolved addresses
                               # and the failure counts (max_fails/fail_timeout)
    server api:8080 resolve;   # re-resolve, needs `zone` and `resolver`
    keepalive 64;
}

server {
    listen 8080;
    access_log /dev/stdout failures if=$not_2xx; # all 2xx lines would slow the test

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;          # needed for upstream keepalive
        # A connect to a stopped container's IP gets no answer and would hang
        # for the default 60 s. Inside the Docker network a connect takes well
        # under a millisecond, so 1 s means the replica is gone: nginx counts a
        # failure and tries the next replica (allowed even for POST, because
        # nothing was sent yet).
        proxy_connect_timeout 1s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
