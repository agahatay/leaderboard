# nginx in front of `docker compose ... --scale api=N` (see compose.lb.yml).
# nginx resolves "api" once at startup; Docker's DNS returns one address per
# replica, so all of them are in the upstream group (round robin).
#
# Same as lb.conf, but a failed POST is also retried on the next replica
# after it was sent. Safe here only because the write is ZADD GT ("best
# score"), which is idempotent; see docs/decisions.md.
# Log only responses that are not 2xx (including 499: the client gave up),
# with the replica that handled them and how long each step took.
map $status $not_2xx {
    ~^2     0;
    default 1;
}
log_format failures '$time_iso8601 status=$status upstream=$upstream_addr '
                    'upstream_status=$upstream_status connect=$upstream_connect_time '
                    'upstream_time=$upstream_response_time request_time=$request_time';

upstream api {
    server api:8080;
    keepalive 64;
}

server {
    listen 8080;
    access_log /dev/stdout failures if=$not_2xx; # all 2xx lines would slow the test

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;          # needed for upstream keepalive
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout non_idempotent;
    }
}
