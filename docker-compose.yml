services:
  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    # Bound to localhost only, so integration tests can reach it from the host
    # without exposing an unauthenticated Redis to the network.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Read from .env (gitignored). Compose refuses to start without it.
      API_KEY: ${API_KEY:?API_KEY is not set. Create .env from .env.example}
      PORT: "8080"
      REDIS_ADDR: redis:6379
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-200ms}
      INGEST_MODE: ${INGEST_MODE:-async}
      QUEUE_SIZE: ${QUEUE_SIZE:-1024}
      WORKERS: ${WORKERS:-4}
      BATCH_SIZE: ${BATCH_SIZE:-100}
      FLUSH_INTERVAL: ${FLUSH_INTERVAL:-50ms}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    # Docker sends SIGKILL after this. It must be longer than SHUTDOWN_TIMEOUT
    # or the queue drain could be cut off (Docker's default is also 10s).
    stop_grace_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  redis-data:
