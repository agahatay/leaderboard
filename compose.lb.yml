# Load-balanced setup: nginx on :8080 in front of several API replicas.
#
#   docker compose -f docker-compose.yml -f compose.lb.yml up -d --build --scale api=3
#
# NGINX_CONF=lb-retry.conf also retries failed POSTs on another replica.
services:
  api:
    # Replicas cannot share host port 8080; only nginx is published.
    ports: !reset []

  nginx:
    image: nginx:1.30.8-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx/${NGINX_CONF:-lb.conf}:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
