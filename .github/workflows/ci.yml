name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test -race (with Redis integration tests)
        run: go test -race -count=1 ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -t leaderboard:ci .

  # On v* tags only, after every other job passed: push the image to
  # GitHub Container Registry as ghcr.io/<owner>/<repo>:<version>.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN may push to this repository's packages
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.3.0 -> 0.3.0, 0.3 and sha-<short commit>; metadata-action
          # also adds "latest" for semver tags (flavor latest=auto).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # On pushes to main, after every other check passed: ask Render to deploy
  # exactly the commit that was tested (ref=<github.sha>), not whatever is
  # newest on main by the time Render handles the request.
  # The hook URL is a secret (anyone with it can trigger a deploy). If the
  # secret is not set, for example on a fork, the job passes and skips.
  # A job-level `if` cannot read secrets, hence the env + step-level checks.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, docker]
    runs-on: ubuntu-latest
    concurrency: deploy # one deploy job at a time (not a guarantee of push order)
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Skip (RENDER_DEPLOY_HOOK not set)
        if: env.RENDER_DEPLOY_HOOK == ''
        run: echo "RENDER_DEPLOY_HOOK is not set; skipping deploy."
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK != ''
        # Prints only the HTTP status and the deploy ID, never the hook URL
        # (it contains the key) or the response body.
        run: |
          case "$RENDER_DEPLOY_HOOK" in
            *\?*) sep='&' ;;
            *)     sep='?' ;;
          esac
          status=$(curl -sS --retry 3 -X POST -o response.json -w '%{http_code}' \
            "${RENDER_DEPLOY_HOOK}${sep}ref=${GITHUB_SHA}")
          echo "Render deploy hook: HTTP $status for commit $GITHUB_SHA"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
          deploy_id=$(jq -r '.deploy.id // empty' response.json)
          if [ -z "$deploy_id" ]; then
            echo "No deploy ID in the response. Top-level keys: $(jq -c 'keys' response.json)"
            exit 1
          fi
          echo "Render deploy ID: $deploy_id"
